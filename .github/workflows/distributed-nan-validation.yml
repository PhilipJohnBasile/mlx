name: Validate native distributed NaN reductions
on:
  push:
    branches: [diagnostics/distributed-nan-validation-20260904]
    paths: [.github/workflows/distributed-nan-validation.yml]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 964d53ffa52242f33800f3a956684176c5962bed
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure compilers and build dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq
            sudo apt-get install -y libopenblas-dev liblapack-dev liblapacke-dev
          else
            sudo xcode-select -s /Applications/Xcode_26.3.app
          fi
          python -m pip install cmake ninja pre-commit pyyaml
          c++ --version
      - name: Recover the regression and vectorized patch scripts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml
          source = yaml.safe_load(Path('.github/workflows/distributed-nan-validation.yml').read_text())
          steps = {s['name']: s['run'] for s in source['jobs']['validate']['steps'] if 'run' in s}
          generation = steps['Add regression tests without changing the implementation']
          anchor = '#include "doctest/doctest.h"'
          assert generation.count(anchor) == 1
          generation = generation.replace(anchor, '#if defined(__ARM_FEATURE_FP16_SCALAR_ARITHMETIC)\n#include <arm_fp16.h>\n#endif\n\n' + anchor)
          for old, new in [
              ('(*input != *input || *output {symbol} *input)', '((*input != *input) | (*output {symbol} *input))'),
              ('({left} != {left} || {left} {symbol} {right})', '(({left} != {left}) | ({left} {symbol} {right}))'),
              ('// Preserve NaNs from either operand so reduction order cannot drop them.', '// Propagate NaNs from either operand; bitwise OR keeps selection vectorizable.'),
              ('// Preserve NaNs from either operand in every reduction path, including BF16.', '// Propagate NaNs from either operand; bitwise OR keeps selection vectorizable.'),
          ]:
              assert generation.count(old) == 1, old
              generation = generation.replace(old, new)
          baseline = steps['Build baseline and prove regression tests fail']
          fixed = steps['Apply root cause fix and validate']
          assert "grep -q 'FAILED'" in baseline
          baseline = baseline.replace("grep -q 'FAILED'", "grep -q 'Status: FAILURE'")
          baseline = baseline.replace('-std=c++17', '-std=c++20')
          fixed = fixed.replace('-std=c++17', '-std=c++20')
          paths = 'mlx/distributed/reduction_ops.h mlx/distributed/jaccl/lib/jaccl/reduction_ops.h tests/distributed_reduction_tests.cpp tests/CMakeLists.txt'
          fixed = fixed.replace('python /tmp/apply-nan-fix.py', 'python /tmp/apply-nan-fix.py\ngit add ' + paths)
          fixed = fixed.replace('pre-commit run --all-files', 'pre-commit run --files ' + paths)
          for name, script in [('generate', generation), ('baseline', baseline), ('fixed', fixed)]:
              Path('/tmp/nan-' + name + '.sh').write_text('set -euo pipefail\n' + script)
          PY
          git checkout --detach b6368984b8e02a3fb3ee7986846c0fb85e1fccf7
          mkdir -p results
          bash /tmp/nan-generate.sh
      - name: Prove the unpatched implementation fails
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/nan-baseline.sh 2>&1 | tee results/baseline-build.log
      - name: Validate the fix and full C++ suite
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/nan-fixed.sh 2>&1 | tee results/fixed-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nan-reduction-${{ matrix.os }}
          path: results
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/distributed-minmax-nan
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: nan-reduction-*
          path: validation-results
      - name: Identify whether the first validated candidate is present
        id: candidate
        run: |
          if [ "$(git rev-parse HEAD)" = b6368984b8e02a3fb3ee7986846c0fb85e1fccf7 ]; then
            echo 'present=false' >> "$GITHUB_OUTPUT"
          else
            echo 'present=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.candidate.outputs.present == 'true'
        with:
          name: nan-reduction-ubuntu-24.04
          run-id: 33936715880
          github-token: ${{ github.token }}
          path: previous-validation
      - name: Publish only the tested patch without overwriting concurrent changes
        run: |
          set -euo pipefail
          base=b6368984b8e02a3fb3ee7986846c0fb85e1fccf7
          cmp validation-results/nan-reduction-macos-15/fix.patch validation-results/nan-reduction-ubuntu-24.04/fix.patch
          if [ "$(git rev-parse HEAD)" != "$base" ]; then
            git apply --reverse --index previous-validation/fix.patch
            test "$(git write-tree)" = "$(git rev-parse "$base^{tree}")"
          fi
          git apply --index validation-results/nan-reduction-macos-15/fix.patch
          git diff --cached --check
          git config user.name 'Philip John Basile'
          git config user.email '1419847+PhilipJohnBasile@users.noreply.github.com'
          git commit -m 'Preserve NaNs in distributed min/max without disabling vectorization'
          git push origin HEAD:refs/heads/fix/distributed-minmax-nan
          git rev-parse HEAD
