name: JACCL peer-loss validation
on:
  push:
    branches: [test/jaccl-peer-loss-3910]
    paths: [.github/workflows/jaccl-peer-loss-validation.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive pinned upstream source
        run: git archive --format=tar.gz --output=mlx-source.tar.gz b6368984b8e02a3fb3ee7986846c0fb85e1fccf7
      - uses: actions/upload-artifact@v4
        with:
          name: mlx-source-3910
          path: mlx-source.tar.gz
          retention-days: 3
